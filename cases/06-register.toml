[group]
title = "辞書登録モード"
ref = "ddskk manual 5 辞書登録モード"

[[case]]
id = "register.no-okuri"
dicts = ["register"]
note = "Registration runs from the first SPC to RET inside one step."
[[case.step]]
keys = "H e n k a n t y u u SPC H e n k a n SPC T y u u SPC RET"
text = "変換中"
preedit = ""
[[case.step]]
keys = "H e n k a n t y u u SPC"
text = "変換中"
preedit = "▼変換中"

[[case]]
id = "register.okuri"
dicts = ["register"]
[[case.step]]
keys = "U g o K u D o u SPC RET"
text = "動く"
preedit = ""
[[case.step]]
keys = "U g o K u"
text = "動く"
preedit = "▼動く"

[[case]]
id = "register.recursive"
dicts = ["register"]
note = "The manual's example: さいきてき opens registration, さいき opens a nested one."
[[case.step]]
keys = "S a i k i t e k i SPC S a i k i SPC S a i SPC K i SPC RET S a i k i SPC T e k i SPC RET"
text = "再帰的"
preedit = ""

[[case]]
id = "register.empty-ret-cancels"
dicts = ["register"]
[[case.step]]
keys = "F u g a SPC RET"
text = ""
preedit = "▽ふが"

[[case]]
id = "register.cg-cancels"
dicts = ["register"]
[[case.step]]
keys = "F u g a SPC C-g"
text = ""
preedit = "▽ふが"

[[case]]
id = "register.after-last-candidate"
dicts = ["basic"]
[[case.step]]
keys = "K a n j i SPC SPC SPC RET"
text = ""
preedit = "▽かんじ"
